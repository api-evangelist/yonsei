- aid: yonsei:elsevier-pure
  name: Yonsei Research Information Portal (Elsevier Pure tenancy)
  x-operator: tenant
  x-vendor: Elsevier
  x-vendor-product: Pure
  description: >-
    Yonsei's research information system is an Elsevier Pure (CRIS) tenancy at
    yonsei.elsevierpure.com. The data is Yonsei's — its researchers, outputs, projects and
    organizational units — but the contract is not: the OpenAPI served at /ws/api/openapi.json
    declares info.title "Pure API", version 5.35.3-4, and contact pure-support@elsevier.com,
    and the same document is shipped by at least nine other institutions in this catalog.
    It is Elsevier's engineering running under Yonsei's name. The specification is publicly
    readable, but the API itself is closed: /ws/api/research-outputs returns 401 with
    "Full authentication is required to access this resource", and the Pure OAI-PMH feed at
    /ws/oai returns 401. Thirty-seven per-tag OpenAPIs split from this one Elsevier document,
    and every schema, example, collection, ruleset, vocabulary, JSON-LD context,
    authentication record and agentic-access record derived from it, were removed from this
    repo on 2026-08-30; they score against Elsevier, not against Yonsei. The tenant
    relationship is kept because it is a real institutional fact and one of the few
    programmable surfaces the university has.
  humanURL: https://yonsei.elsevierpure.com/
  tags:
  - Research Information
  - CRIS
  - Elsevier Pure
  - Tenant
  - Research Repository
  properties:
  - type: Documentation
