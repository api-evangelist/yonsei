- aid: yonsei:yuhspace
  name: YUHSpace Institutional Repository (DSpace)
  x-operator: institution
  description: >-
    YUHSpace is the Yonsei University Health System / Medical Library institutional
    repository, running DSpace 5.5 on Yonsei's own host and built through the National
    Library of Korea OAK distribution project. Its public RSS 2.0 and Atom 1.0 site feeds
    return real XML, but the host puts a JavaScript bot challenge in front of every path:
    an unauthenticated first request returns a 200 with a ~950-byte challenge shell for
    any URL, and only replaying the js-challenge cookie reaches the repository. The
    OAI-PMH webapp is not deployed — /oai/request, /dspace-oai/request and /oai/driver
    all 404 behind the challenge — and there is no DSpace REST API at /rest.
  humanURL: https://ir.ymlib.yonsei.ac.kr/
