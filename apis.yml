- aid: yonsei:data-portal
  name: Yonsei Data Portal
  x-operator: institution
  description: >-
    data.yonsei.ac.kr is an institution-operated data portal — "a collection of data
    resources for Yonsei University members" — on Yonsei's own registrable domain. It is
    a client-rendered Next.js application gated to university members, and it publishes
    no machine-readable surface: /api, /api/health, /openapi.json, /sitemap.xml and
    /llms.txt all return the application's 404 page. Recorded because the institution
    genuinely operates it, not because it is callable.
