x-coverage:
  state: gated
  reason: tenant_only
  detail: >-
    Yonsei publishes no institution-operated REST API and no developer portal. The only
    complete API contract discoverable under its name is Elsevier's Pure API, served from
    the tenant host yonsei.elsevierpure.com: the specification at /ws/api/openapi.json is
    publicly readable (HTTP 200, ~1.7MB) but every data endpoint returns 401 and the Pure
    OAI-PMH feed at /ws/oai returns 401 as well. The 37 per-tag OpenAPIs previously stored
    in this repo were splits of that one Elsevier document and have been removed. The
    institution's own machine-readable surfaces are a SAML 2.0 IdP registered in KAFE and
    eduGAIN, and DSpace RSS/Atom feeds reachable only after satisfying a JS bot challenge.
    The medical-library repository has no OAI-PMH webapp deployed (404 on /oai/request,
    /dspace-oai/request and /oai/driver). Yonsei's generative-AI guideline exists only in
    Korean, on yure.yonsei.ac.kr, and was found by searching in the local language.
  evidence:
    - url: https://yonsei.elsevierpure.com/ws/api/openapi.json
      status: 200
      note: Elsevier's Pure API spec, publicly readable — vendor-authored, tenant-served.
    - url: https://yonsei.elsevierpure.com/ws/api/research-outputs?size=1
      status: 401
      note: 'application/problem+json — "Full authentication is required to access this resource"'
    - url: https://yonsei.elsevierpure.com/ws/oai?verb=Identify
      status: 401
      note: Pure OAI-PMH, credential-gated.
    - url: https://kafe.yonsei.ac.kr/
      status: 200
      note: >-
        Yonsei-operated KAFE federated-authentication server; page states in Korean that
        Yonsei University operates it.
    - url: https://technical.edugain.org/api.php?action=list_entities&format=json
      status: 200
      note: >-
        eduGAIN entity https://kafe.yonsei.ac.kr/idp/simplesamlphp — IDPSSODescriptor,
        federation KAFE, scope yonsei.ac.kr, Sirtfi declared.
    - url: https://ir.ymlib.yonsei.ac.kr/
      status: 200
      note: >-
        JS bot challenge on first request (sets a js-challenge cookie); YUHSpace DSpace 5.5
        home page served once the cookie is replayed. Live, not dead.
    - url: https://ir.ymlib.yonsei.ac.kr/feed/rss_2.0/site
      status: 200
      note: Real RSS 2.0 XML behind the challenge cookie.
    - url: https://ir.ymlib.yonsei.ac.kr/oai/request?verb=Identify
      status: 404
      note: No OAI-PMH webapp deployed on the institution's own repository host.
    - url: https://data.yonsei.ac.kr/
      status: 200
      note: >-
        Yonsei Data Portal, institution-operated Next.js app for Yonsei members only;
        /api, /openapi.json, /llms.txt all 404.
    - url: https://www.yonsei.ac.kr/
      status: 200
      note: GeoIP redirect shell that lands on /sc/index.do (KR) or /en_sc/index.do.
    - url: https://library.yonsei.ac.kr/
      status: 200
      note: Library website; robots.txt disallows all but a handful of notice-board paths. No API found.

apis:

- aid: yonsei:kafe-idp
  name: Yonsei University KAFE Identity Provider (SAML 2.0)
  x-operator: institution
  description: >-
    Yonsei University operates its own SAML 2.0 Identity Provider for KAFE, the Korean
    Access FEderation, on its own registrable domain. The entity is registered by
    kafe.kreonet.net and exported to eduGAIN, where its record shows an IDPSSODescriptor
    role, the shibmd:Scope yonsei.ac.kr, and a REFEDS Sirtfi declaration, first seen
    2024-02-23. The software is SimpleSAMLphp. This is the university's strongest
    institution-operated machine-readable surface: identity federation is
    institution-operated by definition, and Yonsei's own server says so in Korean —
    "본 서버는 KAFE 연합인증 서비스의 제공을 목적으로 연세대학교에서 운영합니다."
    Metadata is not exposed at a public URL on the host; it is distributed through the
    KAFE aggregate and eduGAIN, which is standard federation practice.
  humanURL: https://kafe.yonsei.ac.kr/
