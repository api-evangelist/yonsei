aid: yonsei
name: Yonsei University
x-type: university
x-category: Private Research University
description: >-
  Yonsei University (연세대학교) is a private research university in Seoul, South Korea,
  founded in 1885 and one of the "SKY" institutions. Its programmable footprint is small,
  and most of what previously appeared under its name was not its own engineering: the
  Yonsei Research Information portal at yonsei.elsevierpure.com is an Elsevier Pure (CRIS)
  tenancy whose OpenAPI is authored by Elsevier — info.title "Pure API",
  contact pure-support@elsevier.com — and whose data endpoints and OAI-PMH feed both return
  HTTP 401 to the public. That relationship is recorded here as a tenant surface; the
  contract itself belongs to Elsevier and has been removed from this repo. What Yonsei
  genuinely operates is narrower and more interesting: a SAML 2.0 Identity Provider on its
  own domain (kafe.yonsei.ac.kr) registered in the Korean Access FEderation and exported to
  eduGAIN with the scope yonsei.ac.kr and a Sirtfi declaration; a DSpace 5.5 medical-library
  repository (YUHSpace) at ir.ymlib.yonsei.ac.kr serving public RSS 2.0 and Atom 1.0 feeds
  from behind a JavaScript bot challenge, with no OAI-PMH deployed; and a members-only
  Yonsei Data Portal at data.yonsei.ac.kr that ships no public API. There is no central
  developer portal, no institution-operated REST API, and no official institutional GitHub
  organization — the only GitHub presence is GDGoC Yonsei, a student Google Developer Group.
  The institutional AI posture is a governance document, not an API, and it exists only on
  the Korean surface.
